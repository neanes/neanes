---
name: CI

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            display: xvfb-run --auto-servernum
          - os: windows-latest
            display: ''
          - os: macos-latest
            display: ''
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Enable Corepack
        run: corepack enable npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0

      - name: Build Windows
        if: runner.os == 'Windows'
        run: npm run build -- --win

      - name: Build Linux
        if: runner.os == 'Linux'
        run: npm run build -- --linux --x64 --arm64

      - name: Build macOS
        if: runner.os == 'macOS'
        run: npm run build -- --mac --x64 --arm64

      - name: Configure Linux Electron sandbox
        if: runner.os == 'Linux'
        run: |
          electron_executable="$(node -p 'require("node:fs").realpathSync(require("electron"))')"
          sudo tee /etc/apparmor.d/neanes-ci-electron > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>

          profile neanes-ci-electron "$electron_executable" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser --replace /etc/apparmor.d/neanes-ci-electron

      - name: MCP integration tests
        timeout-minutes: 15
        run: ${{ matrix.display }} npm run test:integration:mcp

      - name: Rendering integration tests
        timeout-minutes: 5
        run: ${{ matrix.display }} npm run test:integration:rendering -- "${{ runner.temp }}/neanes-integration/rendering"

      - name: Saving integration tests
        if: runner.os != 'Windows'
        timeout-minutes: 5
        run: ${{ matrix.display }} npm run test:integration:saving -- "${{ runner.temp }}/neanes-integration/saving"

      - name: Upload integration artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: integration-${{ runner.os }}
          path: ${{ runner.temp }}/neanes-integration
          if-no-files-found: ignore
          retention-days: 7
